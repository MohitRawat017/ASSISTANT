name: Safe smoke

on:
  pull_request:
  push:
    branches:
      - main
      - V2_LG

jobs:
  safe-smoke:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv langchain-core langgraph langchain-ollama google-auth google-auth-oauthlib google-api-python-client google-auth-httplib2

      - name: Collect safe smoke tests
        run: python -m pytest tests/test_safe_smoke.py tests/test_managers.py tests/test_registry_smoke.py tests/test_google_auth.py tests/test_redaction.py tests/test_reliability_r2.py --collect-only -q --no-test-report

      - name: Run safe smoke tests
        run: python -m pytest -q tests/test_safe_smoke.py tests/test_managers.py tests/test_registry_smoke.py tests/test_reliability_r2.py -m safe_smoke --no-test-report

      - name: Run deterministic Wave 1 regression tests
        run: python -m pytest -q tests/test_google_auth.py tests/test_redaction.py --no-test-report
